<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chrome 收藏夹整理器</title>
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body class="popup-body">
    <main class="shell">
      <section class="hero">
        <span class="eyebrow">AI Summary Required</span>
        <h1>Chrome 收藏夹整理器</h1>
        <p>
          本地只负责扫描清点；收藏移动分组由 AI 汇总生成，避免规则误判越整理越乱。
        </p>
      </section>

      <section class="panel controls">
        <button id="scanButton" class="button button-primary">扫描收藏夹</button>
        <button id="applyButton" class="button">应用整理建议</button>
        <button id="undoButton" class="button button-subtle">撤销上次整理</button>
        <button id="optionsButton" class="button button-subtle">打开设置</button>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>扫描总览</h2>
          <span id="scanTime" class="muted">尚未扫描</span>
        </div>
        <div id="summaryGrid" class="summary-grid"></div>
      </section>

      <section class="panel status-panel">
        <div class="section-head">
          <h2>运行状态</h2>
          <span id="providerStatus" class="muted">等待 AI 配置</span>
        </div>
        <div id="statusMessage" class="status-box">
          请先在设置中配置 AI Provider、模型名和 API Key，然后扫描生成整理建议。
        </div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>重复收藏</h2>
          <span class="muted">默认只提示，不自动处理</span>
        </div>
        <div id="duplicatesList" class="stack-list empty-state">
          还没有扫描结果。
        </div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>推荐整理</h2>
          <span class="muted">应用时会先做快照，支持撤销</span>
        </div>
        <div id="suggestionsList" class="stack-list empty-state">
          扫描后会在这里显示建议分类与目标文件夹。
        </div>
      </section>
    </main>

    <script type="module" src="js/popup.js"></script>
  </body>
</html>
