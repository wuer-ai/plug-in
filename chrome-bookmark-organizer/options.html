<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chrome 收藏夹整理器设置</title>
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/options.css" />
  </head>
  <body class="options-body">
    <main class="settings-shell">
      <section class="hero">
        <span class="eyebrow">Settings</span>
        <h1>AI 汇总设置</h1>
        <p>
          收藏移动建议现在完全由 AI 汇总生成。本地扫描只负责清点、重复项与空目录提示。
        </p>
      </section>

      <section class="panel form-panel">
        <label class="toggle-row">
          <span>
            <strong>启用远程 AI 增强</strong>
            <small>关闭时只会显示清点结果，不会生成可应用的移动分组。</small>
          </span>
          <input id="aiEnabled" type="checkbox" />
        </label>

        <div class="model-section">
          <div class="section-head">
            <strong>模型列表</strong>
            <small>可添加多个模型，扫描时使用标记为“当前”的那个。</small>
          </div>
          <ul id="modelList" class="model-list"></ul>

          <div id="modelForm" class="model-form">
            <strong id="modelFormTitle">添加模型</strong>
            <label class="field">
              <span>显示名称</span>
              <input id="modelLabel" type="text" placeholder="例如：公司网关 GPT" />
            </label>
            <label class="field">
              <span>Provider</span>
              <select id="provider">
                <option value="gemini">gemini</option>
                <option value="openai-compatible">openai-compatible</option>
              </select>
            </label>
            <label class="field">
              <span>模型名</span>
              <input
                id="model"
                type="text"
                placeholder="例如：gemini-2.5-flash 或 gpt-4.1-mini"
              />
            </label>
            <label class="field">
              <span>API Base URL</span>
              <input
                id="apiBaseUrl"
                type="text"
                placeholder="填写到 /v1，例如 https://api.openai.com/v1"
              />
              <small>OpenAI-compatible 支持 /v1 或完整接口地址，优先使用 Responses；接口不兼容时回退 Chat Completions。Gemini 请填写原生接口的 /v1beta 地址；Gemini 模型走 OpenAI 兼容网关时，请选择 openai-compatible。</small>
            </label>
            <label class="field">
              <span>API Key</span>
              <input id="apiKey" type="password" placeholder="仅保存在当前扩展存储中" />
            </label>
            <div class="button-row">
              <button id="testModelButton" class="button button-subtle" type="button">测试连接</button>
              <button id="saveModelButton" class="button button-primary" type="button">添加模型</button>
              <button id="cancelEditButton" class="button button-subtle" type="button" hidden>取消编辑</button>
            </div>
            <div id="modelTestStatus" class="status-box" data-tone="info">
              填写后可先点“测试连接”，会用该配置发送一次最小请求。
            </div>
          </div>
        </div>

        <label class="field">
          <span>自定义整理要求</span>
          <textarea
            id="customInstructions"
            rows="5"
            maxlength="2000"
            placeholder="例如：&#10;- 工作相关的放在“工作”一级目录下&#10;- 不要创建超过 6 个一级目录&#10;- 学习资料按学科分类"
          ></textarea>
          <small>会追加到 AI 整理提示词中，下次扫描生效，最多 2000 字。</small>
        </label>

        <label class="toggle-row">
          <span>
            <strong>仅发送标题与域名</strong>
            <small>默认尽量减少外发数据，保护隐私。</small>
          </span>
          <input id="sendTitlesOnly" type="checkbox" />
        </label>

        <label class="toggle-row">
          <span>
            <strong>AI 全量汇总模式</strong>
            <small>固定开启：AI 负责生成完整分组，不再只改文件夹名称。</small>
          </span>
          <input id="remoteNamingOnly" type="checkbox" checked disabled />
        </label>

        <label class="field">
          <span>低置信度阈值（保留兼容）</span>
          <input
            id="lowConfidenceThreshold"
            type="number"
            min="0.4"
            max="0.95"
            step="0.01"
          />
        </label>

        <label class="field">
          <span>单次最多送交 AI 的收藏数</span>
          <input id="maxAiGroupCount" type="number" min="20" max="1000" step="10" />
        </label>

        <div class="button-row">
          <button id="saveButton" class="button button-primary">保存设置</button>
          <button id="resetButton" class="button button-subtle">恢复默认</button>
        </div>

        <div id="settingsStatus" class="status-box">
          请配置 Provider、模型名和 API Key；没有 AI 时不会再使用本地规则猜测分类。
        </div>
      </section>
    </main>

    <script type="module" src="js/options.js"></script>
  </body>
</html>
